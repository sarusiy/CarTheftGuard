plugins {
    id 'com.android.application'
}

/* versionCode/versionName used to be hand-edited constants that, in
 * practice, never actually got bumped across many real rebuilds -- which
 * defeated the whole point of showing them in-app (Connect/About/Fiat tabs
 * all display this specifically to confirm which build is installed after
 * a reinstall, per those screens' own comments). Deriving both from git
 * instead means the displayed version can never go stale silently again:
 * versionCode is the exact commit count (monotonically increasing, exactly
 * what Android requires), and versionName carries the short commit hash so
 * you can always tell precisely which commit is running on the phone. */
def gitCommitCount = {
    try {
        def process = "git rev-list --count HEAD".execute(null, rootDir)
        process.waitFor()
        return process.text.trim().toInteger()
    } catch (Exception ignored) {
        return 1
    }
}

def gitShortHash = {
    try {
        def process = "git rev-parse --short HEAD".execute(null, rootDir)
        process.waitFor()
        def hash = process.text.trim()
        return hash.isEmpty() ? "unknown" : hash
    } catch (Exception ignored) {
        return "unknown"
    }
}

/* Drive API key/folder (used by the About tab's "check Drive for updates"
 * feature) live only in local.properties -- gitignored, never committed --
 * same reasoning as sdk.dir above. Falls back to an empty string so a fresh
 * checkout without those two lines still builds, just with that feature
 * inert rather than a build failure. */
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

android {
    namespace 'com.sarusiy.cartheftguard'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sarusiy.cartheftguard'
        minSdk 26
        targetSdk 35
        versionCode gitCommitCount()
        versionName "0.6.0-" + gitShortHash()
        buildConfigField "String", "DRIVE_API_KEY", "\"${localProperties.getProperty('driveApiKey', '')}\""
        buildConfigField "String", "DRIVE_FOLDER_ID", "\"${localProperties.getProperty('driveFolderId', '')}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
}
